<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>kitty.horse</title>
</head>

<style>

    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        min-height: 100%;
    }
    h1, li {
        position: relative;
        color: #fff;
        text-shadow:
                0 0 5px rgba(255, 255, 255, 0.7),
                0 0 15px rgba(150, 100, 255, 0.7),
                0 0 35px rgba(100, 80, 255, 0.5);
    }

    a {
        cursor: none;
    }

    body {
        cursor: none;
        min-height: 100vh;
        /*background: linear-gradient( rgba(255, 236, 39, 0.5), rgba(0, 228, 54, 0.5));*/
        color: #353535;
        font-family: Arial, Helvetica, sans-serif;
        padding: 68px 0 0 48px;

        background: linear-gradient(
                -30deg,
                #FFCCAA, /* pastel red */
                #83769C /* pastel orange */
        );
        background-size: 550% 150%;
        animation: gradientShift 120s ease infinite;
    }
    @keyframes gradientShift {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    /* Three.js canvas sits behind the HTML. */
    #background {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        pointer-events: none;
    }

    main {
        position: relative;
        z-index: 1;
        max-width: 700px;
    }

    .hero {
        /*min-height: 20px;*/
        height: 100vh;
    }

    h1 {
        font-size: clamp(2.5rem, 8vw, 5rem);
        margin: 0 0 24px;
        letter-spacing: -0.06em;
    }

    h2 {
        font-size: 1.1rem;
        font-weight: normal;
    }

    ul {
        list-style: none;
        margin: 0;
        padding: 0;
    }

    li {
        margin: 12px 0;
    }

    a {
        color: inherit;
        text-decoration-thickness: 1px;
        text-underline-offset: 4px;
    }

    a:hover {
        /*opacity: 0.4;*/
        color: rgba(193, 166, 255, 0.7);
        text-shadow:
                0 0 50px rgba(255, 255, 255, 0.7),
                0 0 150px rgba(150, 100, 255, 0.7),
                0 0 350px rgba(100, 80, 255, 0.5);
    }

    @media (max-width: 600px) {
        body {
            padding: 28px 22px;
        }
    }

    /* black screen on page change */
    .page-transition {
        position: fixed;
        inset: 0;
        background: #000;
        z-index: 9999;
        transform: translateY(100%);
        pointer-events: none;
    }

    .page-transition.is-active {
        transform: translateY(0);
        pointer-events: all;
        transition: transform 0.7s cubic-bezier(0.76, 0, 0.24, 1);
    }

    /* Fade in the destination page */
    body {
        opacity: 0;
        animation: pageFadeIn 0.8s ease forwards;
        animation-delay: 0.7s;
    }

    @keyframes pageFadeIn {
        to {
            opacity: 1;
        }
    }

    body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 9999;

        opacity: 0.4;
        mix-blend-mode: soft-light;

        /*background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.2' numOctaves='8' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");*/
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.65'/%3E%3C/svg%3E");

        background-size: 180px 180px;
    }

    .mouse-glow {
        position: fixed;
        top: 0;
        left: 0;
        width: 250px;
        height: 250px;
        border-radius: 50%;
        pointer-events: none;
        z-index: 9999;

        background: radial-gradient(
                circle,
                rgba(255, 254, 255, 0.5) 2%,
                rgba(180, 130, 255, 0.25) 0%,
                rgba(120, 80, 255, 0.12) 35%,
                transparent 70%
        );

        transform: translate(-50%, -50%);
        filter: blur(15px);
    }

    .cursor-dot {
        position: fixed;
        top: 0;
        left: 0;
        width: 8px;
        height: 8px;
        background: white;
        border-radius: 50%;
        pointer-events: none;
        z-index: 99999;


        box-shadow:
                0 0 5px rgba(255, 255, 255, 0.9) ,
                0 0 15px rgba(167, 139, 250, 0.8),
                0 0 30px rgba(139, 92, 246, 0.5);


        transform: translate(-50%, -50%);
        transition:
                width 0.25s ease,
                height 0.25s ease,
                background 0.25s ease;
    }

    .cursor-dot.hovering {
        width: 50px;
        height: 20px;
        background: rgba(180, 130, 255, 0.5);
        mix-blend-mode: hue;


        /*    box-shadow:*/
        /*            0 0 8px rgba(255, 255, 255, 0.8),*/
        /*            0 0 20px rgba(167, 139, 250, 1),*/
        /*            0 0 45px rgba(139, 92, 246, 0.7);*/
        /*}*/
    }

    body {
        cursor: none;
    }

    a, button {
        cursor: none;
    }


    @media screen and (max-width: 768px) {
        h1 {
            font-size: clamp(2.5rem, 8vw, 4rem);
        }

        h2 {
            font-size: clamp(2rem, 6vw, 3rem);
        }

        h3 {
            font-size: clamp(1.5rem, 4.5vw, 2rem);
        }

        p, li, a, button, label {
            font-size: clamp(1.1rem, 3.5vw, 1.3rem);
        }
    }

</style>
<body>
<div class="mouse-glow"></div>
<div class="cursor-dot"></div>

<section class="hero">
    <h1>kitty.horse</h1>
    <ul>
        <li><a href="/commission" class="gallery-link">commissions</a></li>
        <li><a href="/"><s>originals</s></a> <span class="coming-soon>"><i>coming soon</i></span></li>
        <li><a href="https://www.inprnt.com/gallery/kitty.horse/">prints</a></li>
        <li><a href="/gallery" class="gallery-link">gallery</a></li>
    </ul>
</section>

<!-- black screen on page change-->
<div class="page-transition"></div>


</body>
</html>

<script>
    // cursor dot
    const cursor = document.querySelector(".cursor-dot");

    document.addEventListener("mousemove", (e) => {
        cursor.style.left = `${e.clientX}px`;
        cursor.style.top = `${e.clientY}px`;
    });

    document.querySelectorAll("a, button").forEach((el) => {
        el.addEventListener("mouseenter", () => {
            cursor.classList.add("hovering");
        });

        el.addEventListener("mouseleave", () => {
            cursor.classList.remove("hovering");
        });
    });
// mouse glow
const glow = document.querySelector(".mouse-glow");

document.addEventListener("mousemove", (e) => {
    glow.style.left = `${e.clientX}px`;
    glow.style.top = `${e.clientY}px`;
});

<!-- black screen on page change-->
const galleryLink = document.querySelector(".gallery-link");
const transition = document.querySelector(".page-transition");

galleryLink.addEventListener("click", (e) => {
    if (
        e.metaKey ||
        e.ctrlKey ||
        e.shiftKey ||
        e.altKey ||
        e.button !== 0
    ) return;

    e.preventDefault();

    transition.style.transition =
        "transform 0.7s cubic-bezier(0.76, 0, 0.24, 1)";

    transition.classList.add("is-active");

    setTimeout(() => {
        window.location.href = galleryLink.href;
    }, 700);
});

// so the black screen is dropped when returning to page via back button
window.addEventListener("pageshow", () => {
    transition.classList.remove("is-active");
    transition.style.transition = "none";

    // Reset the overlay position
    transition.style.transform = "translateY(100%)";

    // Restore transitions after the reset
    requestAnimationFrame(() => {
        requestAnimationFrame(() => {
            transition.style.transition =
                "transform 0.7s cubic-bezier(0.76, 0, 0.24, 1)";
        });
    });
});
</script>
