<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pond's Portfolio</title>
  <link rel="icon" type="image/x-icon" href="Assets/favicon.png" />
  <link rel="stylesheet" href="style.css">

</head>
<body>
<header>
  <!--  <img id="logo" src="Assets/logo.png" alt="Artist Portfolio" />-->
  <h1>pond's art</h1>
  <button id="burger-button" aria-label="toggle nav">&#9776;</button>
  <nav id="navbar">
    <a data-target="#home">home & info</a>
    <a data-target="#requests">requests</a>
    <a data-target="#paintings">paintings</a>
    <a data-target="#oekaki">oekaki</a>
    <a data-target="#pixel">pixel</a>
    <a data-target="#music">music</a>
    <a data-target="#code">code</a>
    <a data-target="#blog">blog</a>
    <a data-target="#minecraft">minecraft</a>
    <a data-target="#visitor-book">visitor book</a>
  </nav>
</header>

<main id="page-content">

  {% block content %}{% endblock %}

  </section>
  <!--  close page content-->
</main>

<script src="index.js"></script>

<!--ko-fi bottom left corner widget-->
<script src='https://storage.ko-fi.com/cdn/scripts/overlay-widget.js'></script>
<script>
  kofiWidgetOverlay.draw('pondpondpond', {
    'type': 'floating-chat',
    'floating-chat.donateButton.text': '',
    'floating-chat.donateButton.background-color': 'rgba(106,14,14,0)',
    'floating-chat.donateButton.text-color': '#fff'
  });
</script>

<!-- Overlay image to cover ko-fi logo -->
<img src="" class="kofi-cover" alt="">
<style>
  .kofi-cover {
    position: fixed;
    background-color: #e3e3e3;
    border-radius: 50%;
    image-rendering: pixelated;
    bottom: 20px;   /* adjust until perfectly covering */
    left: 30px;    /* adjust until perfectly covering */
    width: 50px;    /* whatever size you want */
    height: 50px;   /* optional */
    pointer-events: none; /* allow clicks to pass through */
    z-index: 2147483647; /* above Ko-fi widget */
  }
</style>

</body>
</html>
